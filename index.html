<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garden Helpers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root {
  --ground: #f5f1e6; --paper: #ffffff; --ink: #1a2a1f; --muted: #46574c; --line: #c9d3c3;
  --accent: #1d6b3a; --accent-ink: #ffffff; --accent-soft: #e0f0e4;
  --sun: #8a4b00; --sun-soft: #fbeccf; --bad: #a3231a; --bad-soft: #fde5e2;
  --s: 1; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0f1a13; --paper: #172319; --ink: #f1f6f2; --muted: #b3c4b8; --line: #35493b; --accent: #86d9a2; --accent-ink: #0b1f12; --accent-soft: #1e3a27; --sun: #f0b35f; --sun-soft: #3a2a12; --bad: #ff9d94; --bad-soft: #3d1b18; color-scheme: dark; } }
:root[data-theme="dark"] { --ground: #0f1a13; --paper: #172319; --ink: #f1f6f2; --muted: #b3c4b8; --line: #35493b; --accent: #86d9a2; --accent-ink: #0b1f12; --accent-soft: #1e3a27; --sun: #f0b35f; --sun-soft: #3a2a12; --bad: #ff9d94; --bad-soft: #3d1b18; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif; font-size: calc(20px * var(--s)); line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 14px 80px; }
h1 { font-size: calc(1.55em); line-height: 1.15; margin: 8px 0 14px; }
h2 { font-size: 1.25em; margin: 22px 0 8px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: .82em; }
.eyebrow { color: var(--muted); font-weight: 700; letter-spacing: .02em; }

/* accessibility bar: always on top */
.tools { position: sticky; top: 0; z-index: 5; background: var(--ground); padding: 8px 0 10px; border-bottom: 2px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tools button { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; min-height: 56px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.1; }
.tools .ic { font-size: 1.35em; font-weight: 700; }
.tools .wd { font-size: .62em; font-weight: 700; }
html[data-labels="icons"] .tools .wd { display: none; }
html[data-labels="icons"] .tools .ic { font-size: 1.6em; }
.tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.back { margin: 14px 0 0; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 1em; padding: 10px 0; text-decoration: underline; text-underline-offset: 4px; }
.top { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.top .eyebrow { flex: 1; }

/* the big buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 64px; padding: 12px 18px; border-radius: 16px; border: 3px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-align: center; text-decoration: none; }
.btn.alt { background: var(--paper); color: var(--accent); }
.btn.warn { background: var(--paper); color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 48px; width: auto; display: inline-flex; padding: 6px 16px; font-size: .9em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 140px; }
.stack { display: grid; gap: 12px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-height: 168px; padding: 14px 8px; border-radius: 20px; border: 3px solid var(--accent); background: var(--paper); color: var(--ink); }
.tile .big { font-size: 2.6em; line-height: 1; }
.tile .name { font-weight: 800; font-size: 1.05em; }
.tile .sub { font-size: .8em; color: var(--muted); font-weight: 600; }
.tile.t1 { background: var(--accent-soft); } .tile.t3 { background: var(--sun-soft); border-color: var(--sun); }
html[data-big="1"] .tiles { grid-template-columns: 1fr; } html[data-big="1"] .tile { min-height: 120px; flex-direction: row; gap: 14px; justify-content: flex-start; padding: 14px 18px; text-align: left; }
.tile .txt { display: grid; gap: 2px; }

.card { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 0 0 12px; }
.card h3 { margin: 0 0 4px; font-size: 1.05em; }
.banner { background: var(--sun-soft); border: 3px solid var(--sun); border-radius: 16px; padding: 12px 16px; margin: 12px 0; font-weight: 700; }
.error { background: var(--bad-soft); border: 3px solid var(--bad); border-radius: 16px; padding: 12px 16px; margin: 12px 0; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.error button { border: 2px solid var(--bad); background: none; border-radius: 10px; min-height: 44px; padding: 0 14px; font-weight: 700; }
.good { background: var(--accent-soft); border: 3px solid var(--accent); border-radius: 16px; padding: 12px 16px; margin: 12px 0; font-weight: 700; }

label.f { display: block; font-weight: 700; margin: 14px 0 6px; }
input[type=text], input[type=password], input[type=email], input[type=tel], input[type=date], input[type=time], textarea, select { width: 100%; min-height: 60px; padding: 10px 14px; border: 3px solid var(--line); border-radius: 14px; background: var(--paper); }
textarea { min-height: 120px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }

.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; text-align: left; padding: 10px 16px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper); font-weight: 700; margin: 0 0 10px; }
.pick .box { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--muted); display: grid; place-items: center; font-size: 1.1em; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pick[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick .em { font-size: 1.4em; } .pick small { display: block; font-weight: 500; color: var(--muted); font-size: .75em; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.yn .pick { margin: 0; justify-content: center; text-align: center; }

.stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0; }
.stepper button { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--accent); background: var(--paper); color: var(--accent); font-size: 2.2em; font-weight: 800; line-height: 1; }
.stepper .val { min-width: 130px; text-align: center; font-size: 2.2em; font-weight: 800; line-height: 1.05; }
.stepper .val small { display: block; font-size: .4em; font-weight: 700; color: var(--muted); }

.progress { height: 14px; background: var(--line); border-radius: 8px; overflow: hidden; margin: 8px 0 6px; }
.progress > i { display: block; height: 100%; background: var(--accent); }

.task { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; min-height: 64px; }
.task .tick { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--muted); display: grid; place-items: center; font-weight: 800; }
.task.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.done .nm { text-decoration: line-through; color: var(--muted); }
.task .nm { font-weight: 700; } .task .nt { font-size: .78em; color: var(--muted); display: block; font-weight: 500; }

.badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.badge { background: var(--paper); border: 3px solid var(--sun); border-radius: 18px; padding: 14px 8px; text-align: center; }
.badge .em { font-size: 2.8em; line-height: 1.1; } .badge .t { font-weight: 800; font-size: .92em; } .badge .s { font-size: .7em; color: var(--muted); }
.badge.locked { border-style: dashed; border-color: var(--line); opacity: .85; } .badge.locked .em { filter: grayscale(1); opacity: .55; }
html[data-big="1"] .badge-grid { grid-template-columns: 1fr; }
.badge.new { animation: pop .6s ease; background: var(--sun-soft); }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .badge.new { animation: none; } }

details.q { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
details.q summary { padding: 14px 16px; font-weight: 700; cursor: pointer; min-height: 60px; display: flex; align-items: center; }
details.q .a { padding: 0 16px 14px; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: min(1em, 20px * 1.3); }
.cal .dow { text-align: center; font-weight: 800; font-size: .7em; color: var(--muted); padding: 4px 0; }
.cal button { position: relative; aspect-ratio: 1 / 1.05; min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-weight: 700; padding: 0; }
.cal button.out { opacity: .35; } .cal button.today { border-color: var(--accent); border-width: 4px; }
.cal button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cal .dots { position: absolute; bottom: 2px; left: 0; right: 0; font-size: .55em; line-height: 1; }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
.monthbar .btn { width: 64px; min-height: 56px; flex: none; padding: 0; }
.monthbar strong { font-size: 1.1em; text-align: center; }

.spin { text-align: center; padding: 60px 0; font-weight: 700; color: var(--muted); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 20; }
.overlay div { background: var(--paper); border: 3px solid var(--accent); border-radius: 18px; padding: 22px 30px; font-weight: 800; }
.pill { display: inline-block; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 999px; padding: 0 12px; font-size: .75em; font-weight: 700; margin-left: 6px; }
.pill.warn { background: var(--sun-soft); border-color: var(--sun); }
.big-thanks { text-align: center; padding: 10px 0 4px; } .big-thanks .em { font-size: 4em; }
a { color: var(--accent); }
.linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; font-weight: 700; padding: 10px 4px; min-height: 48px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">Just a moment…</div></div>
<script>
'use strict';
// ====== where the server lives (the build step fills this in; local testing can use ?api=http://localhost:8787) ======
var GARDEN_API = 'https://script.google.com/macros/s/AKfycbyCz4t4sK2unL4Ky1fyw8eWcf1ZyO0UXDQDPnmOu2DHcMaZPO8cjE_aYms-cvOKKouY/exec';
(function () { try { var q = new URLSearchParams(location.search).get('api'); if (q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) GARDEN_API = q; } catch (e) {} })();

// ====== little helpers ======
function h(tag, attrs) {
  var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k]; if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  (function add(list) { list.forEach(function (c) { if (c == null || c === false) return; if (Array.isArray(c)) return add(c); el.append(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids);
  return el;
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
var prefs = (function () { try { return JSON.parse(store('garden.prefs') || '{}'); } catch (e) { return {}; } })();
function savePrefs() { store('garden.prefs', JSON.stringify(prefs)); }
var SIZES = [1, 1.2, 1.45, 1.75];
function applyPrefs() {
  var r = document.documentElement, i = Math.max(0, Math.min(3, prefs.size || 0));
  r.style.setProperty('--s', SIZES[i]); r.setAttribute('data-big', i >= 2 ? '1' : '0');
  r.setAttribute('data-labels', prefs.labels === 'icons' ? 'icons' : 'words');
  if (prefs.theme) r.setAttribute('data-theme', prefs.theme); else r.removeAttribute('data-theme');
}
applyPrefs();
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function dayShort(s) { var d = parse(s); return DAYS[d.getDay()].slice(0, 3) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); }
function dayLong(s) { var d = parse(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function hrs(n) { n = Math.round(n * 100) / 100; return n + (n === 1 ? ' hour' : ' hours'); }
function localToday() { return ymd(new Date()); }

// ====== talking to the server ======
var token = store('garden.token') || '', S = null, flash = null, busyCount = 0;
function api(fn, args) {
  busy(1);
  return fetch(GARDEN_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { busy(-1); if (!j.ok) { var e = new Error(j.error); e.server = true; throw e; } return j.result; })
    .catch(function (e) { busy(-1); if (!e.server) e = new Error('Cannot reach the garden just now. Please check your internet and try again.'); throw e; });
}
function busy(d) {
  busyCount = Math.max(0, busyCount + d);
  var o = document.getElementById('ov');
  if (busyCount && !o) document.body.append(h('div', { class: 'overlay', id: 'ov', role: 'status' }, h('div', null, 'Just a moment…')));
  if (!busyCount && o) o.remove();
}
function setState(st) { S = st; }
function fail(e) {
  if (/sign in/i.test(e.message) && S) { signedOut(); return; }
  flash = { kind: 'error', text: e.message }; render();
}
function signedOut() { token = ''; store('garden.token', null); S = null; go('login'); }
function act(promise, then) { return promise.then(function (r) { if (then) then(r); }).catch(fail); }

// ====== screens and navigation ======
var screen = 'login', mgr = 'menu';
function go(s) { flash = null; if (location.hash !== '#' + s) location.hash = s; else render(); }
window.addEventListener('hashchange', function () { var s = location.hash.slice(1) || (token ? 'home' : 'login'); screen = s; if (s !== 'new') { /* leaving wizard keeps draft */ } flash = null; render(); window.scrollTo(0, 0); });

function toolbar() {
  var speaking = !!(window.speechSynthesis && speechSynthesis.speaking);
  function tb(ic, wd, label, fn, pressed) { return h('button', { type: 'button', 'aria-label': label, title: label, 'aria-pressed': pressed ? 'true' : null, onclick: fn }, h('span', { class: 'ic', 'aria-hidden': 'true' }, ic), h('span', { class: 'wd' }, wd)); }
  var dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!prefs.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  return h('div', { class: 'tools', role: 'toolbar', 'aria-label': 'Make this easier to see and hear' },
    tb('A−', 'Smaller', 'Smaller text', function () { prefs.size = Math.max(0, (prefs.size || 0) - 1); savePrefs(); applyPrefs(); }),
    tb('A+', 'Bigger', 'Bigger text', function () { prefs.size = Math.min(3, (prefs.size || 0) + 1); savePrefs(); applyPrefs(); }),
    tb(dark ? '☀️' : '🌙', dark ? 'Day' : 'Night', dark ? 'Switch to day colours' : 'Switch to night colours', function () { prefs.theme = dark ? 'light' : 'dark'; savePrefs(); applyPrefs(); render(); }),
    tb(prefs.labels === 'icons' ? '🔤' : '🖼️', prefs.labels === 'icons' ? 'Words' : 'Icons', prefs.labels === 'icons' ? 'Show words on the buttons' : 'Show pictures only on the buttons', function () { prefs.labels = prefs.labels === 'icons' ? 'words' : 'icons'; savePrefs(); applyPrefs(); render(); }),
    tb(speaking ? '⏹️' : '🔊', speaking ? 'Stop' : 'Read to me', speaking ? 'Stop reading' : 'Read this page aloud', readAloud, speaking));
}
function readAloud() {
  if (!window.speechSynthesis) { flash = { kind: 'error', text: 'Sorry, this phone cannot read aloud.' }; render(); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); render(); return; }
  var main = document.getElementById('main'); if (!main) return;
  var u = new SpeechSynthesisUtterance(main.innerText.replace(/\n+/g, '. '));
  u.rate = 0.9; u.lang = 'en-NZ'; u.onend = u.onerror = function () { render(); };
  speechSynthesis.speak(u); render();
}
function render() {
  var app = document.getElementById('app'), y = window.scrollY;
  if (window.speechSynthesis && speechSynthesis.speaking && !render.keepSpeech) speechSynthesis.cancel();
  app.textContent = '';
  app.append(toolbar());
  var main = h('main', { id: 'main', tabindex: '-1' });
  app.append(main);
  if (flash) main.append(h('div', { class: flash.kind === 'error' ? 'error' : 'good', role: 'alert' }, h('span', null, flash.text), h('button', { type: 'button', onclick: function () { flash = null; render(); } }, 'OK')));
  var map = { login: vLogin, join: vJoin, newpw: vNewPw, home: vHome, list: vList, done: vDone, new: vWizard, coming: vComing, questions: vQuestions, badges: vBadges, manager: vManager };
  var needAuth = screen !== 'login' && screen !== 'join';
  if (needAuth && !token) { screen = 'login'; }
  else if (needAuth && !S) { main.append(h('div', { class: 'spin' }, 'Loading the garden…')); api('load', [token]).then(function (st) { setState(st); render(); }).catch(function (e) { if (/sign in/i.test(e.message)) signedOut(); else { flash = { kind: 'error', text: e.message }; main.textContent = ''; render.retry(); } }); return; }
  (map[screen] || vHome)(main);
  window.scrollTo(0, y);
}
render.retry = function () { var m = document.getElementById('main'); m.append(h('button', { class: 'btn', onclick: function () { S = null; render(); } }, 'Try again')); };
function head(main, title, back) {
  if (back !== false && screen !== 'home') main.append(h('button', { class: 'back', type: 'button', onclick: function () { go(back || 'home'); } }, '← Back'));
  if (S) main.append(h('div', { class: 'eyebrow' }, '🌻 ' + S.garden));
  main.append(h('h1', null, title));
}

// ====== sign in / join ======
function pwField(id, label, auto) {
  var inp = h('input', { type: 'password', id: id, autocomplete: auto, autocapitalize: 'none', spellcheck: 'false' });
  var show = h('button', { type: 'button', class: 'linkbtn', onclick: function () { var on = inp.type === 'password'; inp.type = on ? 'text' : 'password'; show.textContent = on ? 'Hide my password' : 'Show my password'; } }, 'Show my password');
  var frag = document.createDocumentFragment(); frag.append(h('label', { class: 'f', for: id }, label), inp, show); return frag;
}
function vLogin(main) {
  main.append(h('div', { class: 'eyebrow' }, '🌻 Community garden'), h('h1', null, 'Welcome to the garden'));
  main.append(h('p', null, 'Type your full name and your password.'));
  var nm = h('input', { type: 'text', id: 'nm', autocomplete: 'username', value: store('garden.lastName') || '', autocapitalize: 'words', spellcheck: 'false' });
  main.append(h('label', { class: 'f', for: 'nm' }, 'Your full name'), nm, pwField('pw', 'Your password', 'current-password'));
  var go1 = function () {
    var n = nm.value, p = document.getElementById('pw').value;
    if (!n.trim() || !p) { flash = { kind: 'error', text: 'Please type your name and your password.' }; render(); return; }
    store('garden.lastName', n.trim());
    api('signIn', [n, p]).then(function (r) { token = r.token; store('garden.token', token); setState(r.state); if (r.mustChange) go('newpw'); else go('home'); }).catch(function (e) { flash = { kind: 'error', text: e.message }; render(); document.getElementById('nm').value = n; });
  };
  main.append(h('div', { class: 'stack', style: 'margin-top:18px' }, h('button', { class: 'btn', type: 'button', onclick: go1 }, '🔑 Sign in'), h('button', { class: 'btn alt', type: 'button', onclick: function () { go('join'); } }, '🌱 I am new here')));
  main.append(h('p', { class: 'muted small', style: 'margin-top:18px' }, 'Forgotten your password? Ask the Garden Manager. They can give you a new one.'));
  [nm, document.getElementById('pw')].forEach(function (i) { i && i.addEventListener('keydown', function (e) { if (e.key === 'Enter') go1(); }); });
}
